name: Tests

on:
  push:
    branches: [main, "feat/**", "train/**"]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade Pillow
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  dataset-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit dependency
        run: python -m pip install --upgrade Pillow
      - name: Audit public dataset
        run: |
          python tools/audit_dataset.py \
            --dataset datasets \
            --verify-images \
            --verify-labels \
            --verify-splits

  p3-environment-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: emtl-ocr-p3
          cache-environment: true
          post-cleanup: all
      - name: Resolve Linux and Intel macOS lock
        shell: bash -el {0}
        run: conda-lock lock --file environment.yml --virtual-package-spec virtual-packages.yml --lockfile conda-lock.yml
      - uses: actions/upload-artifact@v4
        with:
          name: p3-conda-lock
          path: conda-lock.yml
          if-no-files-found: error
          retention-days: 14

  p3-training-smoke:
    needs: p3-environment-lock
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: emtl-ocr-p3
          cache-environment: true
          post-cleanup: all
      - name: Verify CPU-only PyTorch
        shell: bash -el {0}
        run: |
          python -c "import torch; assert torch.__version__.split('+')[0] == '2.14.1'; assert torch.version.cuda is None"
      - name: Run synthetic-data P3 smoke tests
        shell: bash -el {0}
        run: python -m pytest -q tests/test_training.py
